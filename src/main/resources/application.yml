spring:
  application:
    name: qwik-be

  datasource:
    url: jdbc:mysql://localhost:3306/qwik?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  jwt:
    secret: R3Zlcm5pbmVlckFwcFNlY3JldEtleUZvclF3aWtHYW1lMjAyNCEhIQo=
    expiration-ms: 604800000
  apple:
    key-id: ${APPLE_KEY_ID}
    team-id: ${APPLE_TEAM_ID}
    bundle-id: com.qwik.ios
